modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issues}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
displayURL="${mod_homepage}"
description='''${mod_description}'''
logoFile="assets/ticks/icon.png"
logoBlur=false
authors="${mod_authors}"

[[mixins]]
config="ticks.mixins.json"

[[dependencies.ticks]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.ticks]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version},${minecraft_version_upper_bound})"
ordering="NONE"
side="CLIENT"
