modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issues}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
displayURL="${mod_homepage}"
description='''${mod_description}'''
logoFile="assets/ticks/icon.png"
logoBlur=false
authors="${mod_authors}"

[[mixins]]
config="ticks.mixins.json"

[[dependencies.ticks]]
modId="forge"
mandatory=true
versionRange="${forge_loader_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.ticks]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version},1.20.2)"
ordering="NONE"
side="CLIENT"
