name: Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'build.*.gradle.kts'
      - 'settings.gradle.kts'
      - 'stonecutter.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'build.*.gradle.kts'
      - 'settings.gradle.kts'
      - 'stonecutter.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all supported targets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Gradle itself needs JDK 25 (Fabric Loom 1.18); the last version listed becomes JAVA_HOME.
      # JDK 17 (1.20.1), 21 (1.21.x) and 25 (26.x) are the toolchains the mod compiles with.
      - name: Set up JDK 17, 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test all Stonecutter targets
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Verify artifacts
        shell: bash
        run: |
          mapfile -t target_dirs < <(find versions -mindepth 1 -maxdepth 1 -type d | sort)
          test "${#target_dirs[@]}" -gt 0 || { echo "::error::No Stonecutter targets were found"; exit 1; }

          for target_dir in "${target_dirs[@]}"; do
            mapfile -t artifacts < <(
              find "$target_dir/build/libs" -maxdepth 1 -type f -name '*.jar' \
                ! -name '*-sources.jar' ! -name '*-dev.jar' 2>/dev/null | sort
            )
            test "${#artifacts[@]}" -eq 1 || {
              echo "::error::Expected exactly one release JAR in $target_dir/build/libs, found ${#artifacts[@]}"
              printf '  %s\n' "${artifacts[@]}"
              exit 1
            }
          done
