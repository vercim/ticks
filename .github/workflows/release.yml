name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify the release tag
        id: release_metadata
        run: |
          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$version."
            exit 1
          }

          case "$version" in
            *-alpha*) release_type=alpha ;;
            *-beta*) release_type=beta ;;
            *-*)
              echo "Pre-release versions must contain -alpha or -beta."
              exit 1
              ;;
            *) release_type=release ;;
          esac

          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"

      - name: Build all supported targets
        run: ./gradlew clean build --no-daemon

      - name: Verify publishing configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID" || { echo "Missing CURSEFORGE_PROJECT_ID repository variable."; exit 1; }
          test -n "$CURSEFORGE_TOKEN" || { echo "Missing CURSEFORGE_TOKEN repository secret."; exit 1; }
          test -n "$MODRINTH_PROJECT_ID" || { echo "Missing MODRINTH_PROJECT_ID repository variable."; exit 1; }
          test -n "$MODRINTH_TOKEN" || { echo "Missing MODRINTH_TOKEN repository secret."; exit 1; }

      - name: Verify release has not been published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists. Do not overwrite a published release; publish a new version and tag."
            exit 1
          fi

          mapfile -t target_dirs < <(find versions -mindepth 1 -maxdepth 1 -type d | sort)
          mapfile -t artifacts < <(find versions -path '*/build/libs/*.jar' -type f ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          test "${#target_dirs[@]}" -gt 0 || { echo "No Stonecutter targets were found."; exit 1; }
          test "${#artifacts[@]}" -eq "${#target_dirs[@]}" || {
            echo "Expected one release JAR for each Stonecutter target, found ${#artifacts[@]} JARs for ${#target_dirs[@]} targets."
            exit 1
          }

      - name: Publish to CurseForge and Modrinth
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          ORG_GRADLE_PROJECT_curseforge_project_id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          ORG_GRADLE_PROJECT_modrinth_project_id: ${{ vars.MODRINTH_PROJECT_ID }}
          ORG_GRADLE_PROJECT_release_type: ${{ steps.release_metadata.outputs.release_type }}
          RELEASE_CHANGELOG: See GitHub release notes for ${{ github.ref_name }}.
        run: ./gradlew publishMods --no-daemon

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t artifacts < <(find versions -path '*/build/libs/*.jar' -type f ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          release_options=(--generate-notes --title "$GITHUB_REF_NAME")
          if [ "${{ steps.release_metadata.outputs.release_type }}" != "release" ]; then
            release_options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${artifacts[@]}" "${release_options[@]}"
